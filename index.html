<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan Gamer Live</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    
    <style>
        body { margin: 0; padding: 0; background-color: #0c111b; color: #ffffff; font-family: sans-serif; overflow-x: hidden; }
        header { background: #141b29; padding: 12px 15px; display: flex; justify-content: space-between; border-bottom: 2px solid #1f80e0; }
        .brand { font-size: 18px; font-weight: bold; text-transform: uppercase; }
        .brand span { color: #1f80e0; }

        /* Video Player Area */
        .player-container { width: 100%; max-width: 900px; margin: 0 auto; background: #000; }
        .video-js { width: 100% !important; height: auto; aspect-ratio: 16/9; }

        /* --- PERFECT SCORE CROP (MATCH START HONE PAR) --- */
        .score-box {
            width: 100%;
            height: 250px; /* Height kam rakhi hai taaki match info niche chhip jaye */
            overflow: hidden;
            position: relative;
            background: #fff;
            border-top: 2px solid #1f80e0;
        }

        .score-frame {
            width: 100%;
            height: 1000px;
            position: absolute;
            top: -250px; /* Isse Crex ka upar ka match info aur banner dono saaf ho jayenge */
            border: none;
        }

        /* Fake Chat */
        .chat-box { background: #141b29; margin: 10px; border-radius: 8px; height: 150px; display: flex; flex-direction: column; border: 1px solid #252e3f; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; }
        .msg { margin-bottom: 8px; border-bottom: 1px solid #1f2a3d; padding-bottom: 4px; }
        .user-name { color: #1f80e0; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <div class="brand">RANJAN <span>GAMER</span></div>
        <div style="background:red; padding:2px 8px; border-radius:4px; font-size:10px; font-weight:bold;">LIVE</div>
    </header>

    <div class="player-container">
        <video id="my-video" class="video-js vjs-big-play-centered" controls preload="auto">
            <source src="https://linear-241.voot.com/voot/1/1/1/1/1677651842/master_Layer7.m3u8" type="application/x-mpegURL">
        </video>
    </div>

    <div class="score-box">
        <iframe src="https://crex.com/cricket-live-score/csk-vs-pbks-7th-match-indian-premier-league-2026-match-updates-10Y5" class="score-frame"></iframe>
    </div>

    <div class="chat-box">
        <div id="chat-messages">
            <div class="msg"><span class="user-name">Admin:</span> Match 7:30 baje shuru hoga. Tab tak score yahan apne aap aa jayega!</div>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        var player = videojs('my-video');
        player.on('fullscreenchange', function() {
            if (player.isFullscreen() && screen.orientation) {
                screen.orientation.lock("landscape").catch(e => {});
            }
        });
    </script>
</body>
</html>
