        .brand { font-size: 20px; font-weight: bold; text-transform: uppercase; }
        .brand span { color: #1f80e0; }

        .player-container { width: 100%; max-width: 900px; margin: 0 auto; background: #000; }
        .video-js { width: 100% !important; height: auto; aspect-ratio: 16/9; }

        /* Live View Counter */
        .live-stats { padding: 10px 15px; display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .live-dot { height: 8px; width: 8px; background: red; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0; } }
        .view-count { font-weight: bold; color: #ffcc00; }

        /* Chat System */
        .chat-box { background: #141b29; margin: 10px; border-radius: 8px; height: 300px; display: flex; flex-direction: column; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; }
        .msg { margin-bottom: 8px; }
        .user-name { color: #1f80e0; font-weight: bold; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #252e3f; }
        #chat-input { flex: 1; background: #0c111b; border: 1px solid #333; color: white; padding: 8px; border-radius: 4px; outline: none; }
        #send-btn { background: #1f80e0; border: none; color: white; padding: 0 15px; margin-left: 5px; border-radius: 4px; cursor: pointer; }

    <script>
        // 1. Fake View Counter (60-106)
        function updateViews() {
            const count = Math.floor(Math.random() * (106 - 60 + 1)) + 60;
            document.getElementById('v-count').innerText = count;
        }
        setInterval(updateViews, 5000);

        // 2. Random Chat Names
        const randomNames = ["Bihari_Boy", "GamerKing", "Cricket_Fan", "Ranjan_Fan", "FreeFire_Lover", "ProStreamer"];
        const fakeComments = ["Bhai mast chal raha hai!", "High quality hai ek dum.", "RCB jitegi aaj!", "Ranjan bhai OP!", "No lag bro, thanks!"];

        function addMessage(user, text) {
            const chatBox = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'msg';
            div.innerHTML = `<span class="user-name">${user}:</span> ${text}`;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Send User Message
        document.getElementById('send-btn').onclick = function() {
            const input = document.getElementById('chat-input');
            if(input.value) {
                const randomUser = randomNames[Math.floor(Math.random() * randomNames.length)];
                addMessage(randomUser, input.value);
                input.value = "";
            }
        };

        // Fake Auto Comments
        setInterval(() => {
            const user = randomNames[Math.floor(Math.random() * randomNames.length)];
            const comment = fakeComments[Math.floor(Math.random() * fakeComments.length)];
            addMessage(user, comment);
        }, 8000);
    </script>
