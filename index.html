        header { background: #0f1014; padding: 12px 15px; border-bottom: 1px solid #252833; }
        .brand { font-size: 18px; font-weight: bold; text-transform: uppercase; }
        .brand span { color: #1f80e0; }

        /* Video Player */
        .player-container { width: 100%; max-width: 900px; margin: 0 auto; background: #000; }
        .video-js { width: 100% !important; height: auto; aspect-ratio: 16/9; }

        /* Title Area */
        .match-info-bar { padding: 12px 15px; background: #0f1014; }
        .title-text { font-size: 18px; font-weight: bold; }
        .sub-text { font-size: 12px; color: #8f98b2; margin-top: 3px; }

        /* --- TABS SYSTEM --- */
        .tabs-bar { display: flex; background: #16181f; border-bottom: 1px solid #252833; }
        .tab-item { 
            flex: 1; padding: 12px 0; text-align: center; 
            font-size: 14px; font-weight: bold; color: #8f98b2; 
            cursor: pointer; border-bottom: 3px solid transparent; 
        }
        .tab-item.active { color: #ffffff; border-bottom: 3px solid #1f80e0; }

        /* Content Sections */
        .tab-content { display: none; width: 100%; }
        .tab-content.active { display: block; }

        /* 1st Interface: Scorecard (Direct Link) */
        .score-frame { width: 100%; height: 600px; border: none; background: #fff; }

        /* 2nd Interface: Commentary / Chat */
        .chat-section { background: #0f1014; height: 450px; display: flex; flex-direction: column; }
        #chat-display { flex: 1; overflow-y: auto; padding: 15px; }
        .chat-msg { margin-bottom: 10px; background: #1a1c24; padding: 10px; border-radius: 6px; font-size: 13px; border-left: 3px solid #1f80e0; }
        .u-name { font-weight: bold; color: #1f80e0; margin-right: 5px; }

        .input-bar { display: flex; padding: 10px; background: #16181f; border-top: 1px solid #252833; }
        #user-input { flex: 1; background: #0f1014; border: 1px solid #323645; color: white; padding: 10px; border-radius: 4px; outline: none; }
        #send-btn { background: #1f80e0; border: none; color: white; padding: 0 15px; margin-left: 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        var player = videojs('my-video');

        // Tab Switching Logic
        function switchTab(evt, tabId) {
            var contents = document.getElementsByClassName("tab-content");
            for (var i = 0; i < contents.length; i++) {
                contents[i].style.display = "none";
            }
            var tabs = document.getElementsByClassName("tab-item");
            for (var i = 0; i < tabs.length; i++) {
                tabs[i].classList.remove("active");
            }
            document.getElementById(tabId).style.display = "block";
            evt.currentTarget.classList.add("active");
        }

        // Auto-scroll chat to bottom
        setInterval(() => {
            const chatDisp = document.getElementById('chat-display');
            chatDisp.scrollTop = chatDisp.scrollHeight;
        }, 1000);
    </script>
