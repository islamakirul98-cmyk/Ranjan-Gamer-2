    <style>
        body { margin: 0; padding: 0; background-color: #0c111b; color: white; font-family: sans-serif; overflow-x: hidden; }
        
        /* Header & Blue Line */
        header { 
            background: #141b29; padding: 15px; display: flex; 
            justify-content: space-between; align-items: center; border-bottom: 3px solid #1f80e0; 
        }
        .brand { font-size: 20px; font-weight: bold; text-transform: uppercase; }
        .brand span { color: #1f80e0; }
        .live-label { background: red; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }

        /* 1. Video Player Section (On Top) */
        .player-container { width: 100%; max-width: 900px; margin: 0 auto; background: #000; position: relative; }
        .video-js { width: 100% !important; height: auto; aspect-ratio: 16/9; }
        
        /* Landscape Full Screen Button */
        .fs-btn {
            position: absolute; bottom: 50px; right: 10px; z-index: 10;
            background: rgba(31, 128, 224, 0.7); border: none; color: white;
            padding: 8px 12px; border-radius: 5px; cursor: pointer; font-size: 13px;
        }

        /* 2. REAL SCORECARD (Just Below Video) */
        .score-widget {
            background: linear-gradient(90deg, #3a225d 0%, #004ba0 100%); /* KKR Purple to MI Blue */
            margin: 10px; padding: 15px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
            border: 1px solid #1f80e0; box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .team-box { text-align: center; flex: 1; }
        .team-logo { font-size: 24px; font-weight: bold; display: block; }
        .score-info { flex: 2; text-align: center; border-left: 1px solid rgba(255,255,255,0.2); border-right: 1px solid rgba(255,255,255,0.2); }
        .live-score { font-size: 22px; font-weight: bold; color: #ffcc00; margin: 5px 0; }
        .match-over { font-size: 12px; color: #ccc; }

        /* 3. FAKE COMMENT SYSTEM (Just Below Scorecard) */
        .chat-box { background: #141b29; margin: 10px; border-radius: 8px; height: 300px; display: flex; flex-direction: column; border: 1px solid #252e3f; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; }
        .msg { margin-bottom: 8px; display: flex; align-items: flex-start; gap: 8px; }
        .user-avatar { width: 30px; height: 30px; background: #333; border-radius: 50%; display: flex; justify-content: center; align-items: center; color: #aaa; font-size: 14px; }
        .user-name { color: #1f80e0; font-weight: bold; }
        .user-msg { color: #eee; }

        /* Chat Input Area */
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #252e3f; background: #1a2233; border-radius: 0 0 8px 8px; }
        #chat-input { flex: 1; background: #0c111b; border: 1px solid #333; color: white; padding: 8px; border-radius: 4px; outline: none; }
        #send-btn { background: #1f80e0; border: none; color: white; padding: 0 15px; margin-left: 5px; border-radius: 4px; cursor: pointer; font-weight: bold; }

    </style>
</head>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        // 1. Full Screen + Auto Landscape Logic
        function goFullScreen() {
            const elem = document.getElementById("fullscreen-area");
            if (elem.requestFullscreen) { elem.requestFullscreen(); } 
            else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); } 
            else if (elem.msRequestFullscreen) { elem.msRequestFullscreen(); }

            // Screen Landscape Mode (Secured connections only)
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(function(error) {
                    console.log("Orientation lock failed: ", error);
                });
            }
        }

        // 2. Simple Random Chat Logic
        const randomNames = ["Bihari_Hero", "GamerKing", "CricketFan99", "Ranjan_Fan", "MI_Paltan", "KKR_Rider", "ProStreamer_BR"];
        const fakeComments = [
            "Bhai KKR jitegi aaj likh ke le lo!", 
            "Rohit Sharma ka century pakka hai aaj.", 
            "High quality stream bro, thanks!", 
            "Maza aa gaya match dekh ke.", 
            "Ranjan bhai OP stream!"
        ];

        function addMessage(user, text, isUser=false) {
            const chatBox = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = 'msg';
            
            // Random Icon for Avatar
            const icon = isUser ? 'fa-user' : 'fa-robot';
            div.innerHTML = `
                <div class="user-avatar"><i class="fas ${icon}"></i></div>
                <div>
                    <span class="user-name">${user}:</span> 
                    <span class="user-msg">${text}</span>
                </div>
            `;
            chatBox.appendChild(div);
            // Auto scroll to bottom
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Send User Message
        document.getElementById('send-btn').onclick = function() {
            const input = document.getElementById('chat-input');
            if(input.value) {
                // User's name will be also random to avoid name entry
                const randomUser = randomNames[Math.floor(Math.random() * randomNames.length)];
                addMessage(randomUser, input.value, true);
                input.value = "";
            }
        };

        // Fake Auto Comments (Every 8 seconds)
        setInterval(() => {
            const user = randomNames[Math.floor(Math.random() * randomNames.length)];
            const comment = fakeComments[Math.floor(Math.random() * fakeComments.length)];
            addMessage(user, comment);
        }, 8000);

        // 3. Fake Score Update (Just for demonstration)
        function updateScore() {
            // Sample update every minute
            const runs = 154 + Math.floor(Math.random() * 5);
            const wickets = 4 + Math.floor(Math.random() * 2);
            document.getElementById('match-score').innerText = runs + "/" + wickets;
            document.getElementById('match-over').innerText = "18.5 Overs";
        }
        setInterval(updateScore, 60000); // Update every minute
    </script>
