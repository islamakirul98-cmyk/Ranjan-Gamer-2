        header { background: #141b29; padding: 15px; display: flex; justify-content: space-between; border-bottom: 3px solid #1f80e0; }

            border: 2px solid #1f80e0; background: #fff;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);

        .score-frame { width: 100%; height: 210px; border: none; }

        /* Chat System */
        .chat-box { background: #141b29; margin: 10px; border-radius: 8px; height: 260px; display: flex; flex-direction: column; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; }
        .msg { margin-bottom: 8px; border-bottom: 1px solid #1f2a3d; padding-bottom: 4px; }
        .user-name { color: #1f80e0; font-weight: bold; margin-right: 5px; }

        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #252e3f; }
        #chat-input { flex: 1; background: #0c111b; border: 1px solid #333; color: white; padding: 10px; border-radius: 4px; outline: none; }
        #send-btn { background: #1f80e0; border: none; color: white; padding: 0 20px; margin-left: 8px; border-radius: 4px; font-weight: bold; }

    <script>
        var player = videojs('my-video');

        // Auto Landscape on Fullscreen Trigger
        player.on('fullscreenchange', function() {
            if (player.isFullscreen()) {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock("landscape").catch(e => console.log("Landscape lock failed"));
                }
            }
        });

        // Fake Chat Auto-Comments
        const names = ["Ranjan_Fan_Gaya", "Bihari_Tigers", "Hitman_Lover", "IPL_Addict", "Gamer_Boy_Ranjan"];
        const comments = ["Bhai kya solid stream hai!", "KKR ki batting khatarnak hai.", "MI comeback karegi bhai.", "Zero lag bro, maza aa gaya!", "Aaj kaun jitega?"];
        
        setInterval(() => {
            const chatMessages = document.getElementById('chat-messages');
            const randomName = names[Math.floor(Math.random() * names.length)];
            const randomMsg = comments[Math.floor(Math.random() * comments.length)];
            
            chatMessages.innerHTML += `<div class="msg"><span class="user-name">${randomName}:</span> ${randomMsg}</div>`;
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 9000);

        // User Chat Logic (With Random Name)
        document.getElementById('send-btn').onclick = function() {
            const input = document.getElementById('chat-input');
            if(input.value.trim() !== "") {
                const userNames = ["Guest_User", "Viewer_X", "Cricket_Fan_Bihar"];
                const name = userNames[Math.floor(Math.random() * userNames.length)];
                document.getElementById('chat-messages').innerHTML += `<div class="msg"><span class="user-name">${name}:</span> ${input.value}</div>`;
                input.value = "";
                document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
            }
        };
    </script>
