<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan Gamer - Live TV</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* --- Sabse Simple Dark Mode Style --- */
        body {
            margin: 0;
            padding: 0;
            background-color: #0c111b; /* Asli Dark Blue Background */
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Top Floor: Ranjan Gamer Name */
        header {
            background-color: #141b29;
            padding: 15px 5%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 3px solid #1f80e0; /* Teri Blue Line */
        }

        .brand-logo {
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            color: #ffffff;
        }

        .brand-logo span {
            color: #1f80e0; /* Blue Color for Gamer */
        }

        /* Bada Poster Banner */
        .main-banner {
            width: 90%;
            height: 180px;
            margin: 20px auto;
            background: linear-gradient(to right, #1f80e0, #0c111b);
            border-radius: 10px;
            display: flex;
            align-items: center;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .banner-info h2 { margin: 0; font-size: 24px; }
        .banner-info p { margin: 5px 0; color: #a0a0a0; }

        /* News Channel Style List */
        .section {
            padding: 10px 5% 100px 5%;
        }

        .section-title {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
            color: #1f80e0;
        }

        .channel-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }

        .channel-card {
            background: #141b29;
            border-radius: 8px;
            overflow: hidden;
            text-align: center;
            transition: 0.3s;
            border: 1px solid #1f80e033;
            cursor: pointer;
        }

        .channel-card:hover {
            border-color: #1f80e0;
            transform: scale(1.05);
        }

        .channel-card img {
            width: 100%;
            height: 150px;
            object-fit: cover;
        }

        .channel-name {
            padding: 10px;
            font-size: 14px;
            font-weight: 500;
        }

        /* Bottom App Navigation */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #141b29;
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            border-top: 1px solid #252e3f;
        }

        .nav-item {
            color: #8894ab;
            text-decoration: none;
            font-size: 11px;
            text-align: center;
        }

        .nav-item i { font-size: 20px; display: block; margin-bottom: 3px; }
        .nav-item.active { color: #ffffff; }

    </style>
</head>
<body>

    <header>
        <div class="brand-logo">RANJAN <span>GAMER</span></div>
        <div class="menu"><i class="fas fa-bars"></i></div>
    </header>

    <div class="main-banner">
        <div class="banner-info">
            <h2>IPL 2026 LIVE</h2>
            <p>Ranjan Gamer Special Streaming</p>
        </div>
    </div>

    <div class="section">
        <div class="section-title">LIVE CHANNELS</div>
        <div class="channel-grid">
            <div class="channel-card">
                <img src="https://via.placeholder.com/150x200?text=Star+Sports" alt="Star Sports">
                <div class="channel-name">Star Sports 1</div>
            </div>
            <div class="channel-card">
                <img src="https://via.placeholder.com/150x200?text=Sports+18" alt="Sports 18">
                <div class="channel-name">Sports 18</div>
            </div>
            <div class="channel-card">
                <img src="https://via.placeholder.com/150x200?text=Aaj+Tak" alt="Aaj Tak">
                <div class="channel-name">Aaj Tak News</div>
            </div>
            <div class="channel-card">
                <img src="https://via.placeholder.com/150x200?text=Gaming" alt="Gaming">
                <div class="channel-name">Ranjan Gaming</div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="#" class="nav-item active"><i class="fas fa-home"></i>Home</a>
        <a href="#" class="nav-item"><i class="fas fa-play-circle"></i>Live</a>
        <a href="#" class="nav-item"><i class="fas fa-user"></i>Profile</a>
    </div>

</body>
</html>
