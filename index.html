<!DOCTYPE html>
<html lang="hi">
<head>
<style>
    body { font-family: 'Arial', sans-serif; display: flex; justify-content: center; background-color: #f0f0f0; }
    .poster {
        width: 400px; border: 10px solid #ffd700; background: white;
        text-align: center; position: relative; overflow: hidden;
    }
    .header { background-color: #004d40; color: #ccff00; padding: 15px; font-weight: bold; }
    .title { color: #800000; font-size: 24px; margin-top: 10px; font-weight: bold; }
    .post-box { background: #d32f2f; color: white; display: inline-block; padding: 5px 20px; border-radius: 5px; font-size: 20px; }
    .panchayat { background: #0288d1; color: white; padding: 5px 30px; border-radius: 20px; display: inline-block; margin: 10px 0; }
    .details { text-align: left; padding-left: 20px; color: #000; font-weight: bold; line-height: 1.6; }
    .yuva { background: #d32f2f; color: white; padding: 5px 15px; border-radius: 20px; display: inline-block; font-size: 18px; }
    .footer { background: #004d40; color: white; padding: 10px; margin-top: 20px; font-size: 14px; }
    .candidate-img { width: 180px; position: absolute; bottom: 40px; right: 10px; }
    .mission { background: #0d47a1; color: white; width: 150px; padding: 5px; border-radius: 10px 0 0 10px; position: absolute; bottom: 65px; left: 100px; }
</style>
</head>
<body>

<div class="poster">
    <div class="header">
        ● आप करोगे समर्थन <br> हम करेंगे परिवर्तन ●
    </div>
    
    <div class="title">नई सोच नया उम्मीदवार</div>
    <div class="post-box">मुखिया पद प्रत्याशी</div>
    
    <br>
    <div class="panchayat">पंचायत बिलारी</div>
    
    <div class="details">
        <p style="color: #fbc02d;">संघर्षशील कर्मठ</p>
        <p style="color: #388e3c;">सुख दुःख के साथी</p>
        <p style="color: #0288d1;">अपने बेटे अपने भाई</p>
        <p style="font-size: 22px;">ईमानदार</p>
    </div>

    <div class="yuva">युवा प्रत्याशी</div>
    
    <div class="mission">मिशन 2026</div>

    <!-- उम्मीदवार का नाम -->
    <div style="position: absolute; bottom: 50px; right: 20px; color: #d32f2f; font-weight: bold;">
        सच्चिदानन्द कुमार <br> <span style="font-size: 14px;">उर्फ बिट्टू कुमार</span>
    </div>

    <div class="footer">
        <b>निवेदक -</b> समस्त ग्रामवासी, क्षेत्रवासी एवं मित्रगण
    </div>
</div>

</body>
</html>
