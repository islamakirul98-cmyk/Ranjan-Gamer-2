<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aviator Style Framework</title>
    <!-- Tailwind CSS for sleek premium dark mode look -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Smooth animation for the multiplier chart window */
        .chart-bg {
            background: radial-gradient(circle, #1f122e 0%, #0b0612 100%);
        }
    </style>
</head>
<body class="bg-[#0f0817] text-white font-sans min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Main Game Container -->
    <div class="w-full max-w-lg bg-[#160d23] rounded-2xl border border-purple-900/40 p-6 shadow-2xl">
        
        <!-- Header / Partner Branding -->
        <div class="flex justify-between items-center mb-6 border-b border-purple-900/30 pb-3">
            <span class="text-red-500 font-black tracking-widest text-xl italic">AVIATOR</span>
            <span class="bg-red-600 text-[10px] font-bold px-2 py-0.5 rounded text-white tracking-wider">UFC PARTNER</span>
        </div>

        <!-- Live Chart Display Area -->
        <div class="chart-bg h-64 rounded-xl relative flex flex-col items-center justify-center border border-purple-900/20 overflow-hidden mb-6">
            <!-- Animated Multiplier Number -->
            <div id="multiplierDisplay" class="text-5xl font-extrabold text-white tracking-wide transition-all duration-75">1.00x</div>
            <!-- Status Text -->
            <div id="gameStatus" class="text-xs uppercase text-purple-400 font-semibold tracking-wider mt-2">Waiting next round...</div>
        </div>

        <!-- Betting Controls -->
        <div class="bg-[#1d122b] p-4 rounded-xl border border-purple-900/30">
            <div class="flex gap-4 items-center">
                <div class="flex-1">
                    <span class="text-[11px] text-purple-400 block mb-1 font-medium">Bet Amount (INR)</span>
                    <input type="number" id="betAmount" value="100" class="w-full bg-[#0f0817] border border-purple-900/50 rounded-lg p-2.5 text-center font-bold text-lg focus:outline-none focus:border-purple-500">
                </div>
                <button id="actionBtn" onclick="handleAction()" class="flex-1 bg-red-600 hover:bg-red-700 active:scale-95 transition-all text-white font-black text-xl py-4 rounded-xl tracking-wider shadow-lg shadow-red-700/20">
                    PLACE BET
                </button>
            </div>
        </div>

    </div>

    <!-- Script for Basic Multiplier Generation & Crash Logic -->
    <script>
        let multiplier = 1.00;
        let gameInterval;
        let isPlaying = false;
        let isBetted = false;
        let crashPoint = 0;

        const multiplierDisplay = document.getElementById('multiplierDisplay');
        const gameStatus = document.getElementById('gameStatus');
        const actionBtn = document.getElementById('actionBtn');

        // Logic to generate a random crash point (Just like Provably Fair algorithm logic)
        function generateCrashPoint() {
            let e = Math.random();
            if (e < 0.05) return 1.00; // 5% chance of instant crash
            return parseFloat((1.01 + (0.05 / (1 - e)) * Math.random()).toFixed(2));
        }

        function startRound() {
            multiplier = 1.00;
            crashPoint = generateCrashPoint();
            console.log("Next Crash Target: ", crashPoint); // For debugging purposes
            
            isPlaying = true;
            gameStatus.innerText = "Plane is flying...";
            gameStatus.classList.remove('text-red-500');
            gameStatus.classList.add('text-green-400');

            if(isBetted) {
                actionBtn.innerText = "CASH OUT";
                actionBtn.classList.remove('bg-red-600');
                actionBtn.classList.add('bg-yellow-500');
            }

            gameInterval = setInterval(() => {
                multiplier += 0.01;
                multiplierDisplay.innerText = multiplier.toFixed(2) + 'x';

                // Check for Crash Condition
                if (multiplier >= crashPoint) {
                    clearInterval(gameInterval);
                    handleCrash();
                }
            }, 50); // Speed of multiplier growth
        }

        function handleCrash() {
            isPlaying = false;
            multiplierDisplay.innerText = 'FLEW AWAY!';
            multiplierDisplay.classList.add('text-red-500');
            gameStatus.innerText = `Crashed at ${crashPoint.toFixed(2)}x`;
            gameStatus.classList.replace('text-green-400', 'text-red-500');
            
            // Reset Button State
            isBetted = false;
            actionBtn.innerText = "PLACE BET";
            actionBtn.className = "flex-1 bg-red-600 hover:bg-red-700 text-white font-black text-xl py-4 rounded-xl tracking-wider";

            // Next round auto-trigger setup
            setTimeout(() => {
                multiplierDisplay.classList.remove('text-red-500');
                startRound();
            }, 4000); 
        }

        function handleAction() {
            if (!isPlaying && !isBetted) {
                // Place bet before game starts
                isBetted = true;
                actionBtn.innerText = "WAITING...";
                actionBtn.classList.replace('bg-red-600', 'bg-purple-700');
            } else if (isPlaying && isBetted) {
                // Cash out during game runtime
                let winAmount = (document.getElementById('betAmount').value * multiplier).toFixed(2);
                alert(`Successfully Cashed Out! You Won: ₹${winAmount}`);
                isBetted = false;
                actionBtn.innerText = "BET PLACED (WON)";
                actionBtn.disabled = true;
                actionBtn.classList.replace('bg-yellow-500', 'bg-gray-600');
            }
        }

        // Initialize the game loop on window load
        window.onload = () => {
            startRound();
        };
    </script>
</body>
</html>
