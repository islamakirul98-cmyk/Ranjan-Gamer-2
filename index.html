    <script>
        var player = videojs('my-video');

        // AUTO LANDSCAPE ON FULLSCREEN
        player.on('fullscreenchange', function() {
            if (player.isFullscreen()) {
                if (screen.orientation && screen.orientation.lock) {
                    screen.orientation.lock("landscape").catch(e => console.log(e));
                }
            } else {
                if (screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            }
        });

        // FAKE COMMENTS LOGIC
        const names = ["Bihari_Gamer", "Ranjan_Fans", "Hitman_Fan", "IPL_Lovers"];
        const texts = ["Bhai kya match hai!", "KKR OP!", "Mumbai comeback karegi!", "Stream ek dum mast hai."];
        
        setInterval(() => {
            const msg = `<div class="msg"><span class="user-name">${names[Math.floor(Math.random()*4)]}:</span> ${texts[Math.floor(Math.random()*4)]}</div>`;
            document.getElementById('chat-messages').innerHTML += msg;
            document.getElementById('chat-messages').scrollTop = 9999;
        }, 8000);

        document.getElementById('send-btn').onclick = function() {
            const val = document.getElementById('chat-input').value;
            if(val) {
                document.getElementById('chat-messages').innerHTML += `<div class="msg"><span class="user-name">Guest:</span> ${val}</div>`;
                document.getElementById('chat-input').value = "";
                document.getElementById('chat-messages').scrollTop = 9999;
            }
        };
