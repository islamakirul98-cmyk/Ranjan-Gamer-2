<!DOCTYPE html>

<head>

    <style>
        body { margin: 0; padding: 0; background-color: #0f1014; color: #ffffff; font-family: sans-serif; overflow-x: hidden; }
        header { background: #0f1014; padding: 12px 15px; border-bottom: 1px solid #252833; }
        .brand { font-size: 18px; font-weight: bold; text-transform: uppercase; }
        .brand span { color: #1f80e0; }

        /* ====== 1. VIDEO INTRO OVERLAY ====== */
        #intro-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100vh;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 99999; /* Player se bhi upar rakhne ke liye */
            cursor: pointer;
            transition: opacity 0.8s ease-in-out, visibility 0.8s ease-in-out;
        }

        #click-prompt {
            color: #00a2ff;
            font-size: 22px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: absolute;
            z-index: 100000;
            animation: blink 1.2s infinite;
            text-shadow: 0 0 10px #00a2ff;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid #00a2ff;
        }

        #intro-overlay video {
            width: 100%; height: 100%;
            object-fit: cover;
            display: none;
        }

        .hide-intro {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Video Player Section */
        .player-container { width: 100%; max-width: 900px; margin: 0 auto; background: #000; position: relative; }
        .video-js { width: 100% !important; height: auto; aspect-ratio: 16/9; }

        /* --- PREMIUM COLOURFUL LOADING SPINNER --- */
        .vjs-loading-spinner {
            border: none !important;
            opacity: 1 !important;
            visibility: visible !important;
            width: 70px !important;
            height: 70px !important;
            margin-top: -35px !important;
            margin-left: -35px !important;
            background: none !important;
        }

        .vjs-loading-spinner:before, .vjs-loading-spinner:after {
            content: "" !important;
            position: absolute !important;
            top: 0 !important; left: 0 !important;
            width: 100% !important; height: 100% !important;
            border-radius: 50% !important;
            border: 5px solid transparent !important;
            border-top-color: #ff0055 !important;
            border-bottom-color: #00e5ff !important;
            animation: vjs-spinner-spin 1s linear infinite !important;
        }

        .vjs-loading-spinner:after {
            border-top-color: #72ff00 !important;
            border-bottom-color: #ffb300 !important;
            animation: vjs-spinner-spin 1.5s linear reverse infinite !important;
        }

        @keyframes vjs-spinner-spin {
            0% { transform: rotate(0deg); filter: hue-rotate(0deg); }
            100% { transform: rotate(360deg); filter: hue-rotate(360deg); }
        }

        /* UI Styling */
        .tabs-bar { display: flex; background: #16181f; border-bottom: 1px solid #252833; }
        .tab-item { flex: 1; padding: 12px 0; text-align: center; font-size: 14px; font-weight: bold; color: #8f98b2; cursor: pointer; border-bottom: 3px solid transparent; }
        .tab-item.active { color: #ffffff; border-bottom: 3px solid #1f80e0; }

        .tab-content { display: none; width: 100%; }
        .tab-content.active { display: block; }
        .score-frame { width: 100%; height: 600px; border: none; background: #fff; }

        .chat-section { background: #0f1014; height: 450px; display: flex; flex-direction: column; }
        #chat-display { flex: 1; overflow-y: auto; padding: 15px; }
        .chat-msg { margin-bottom: 10px; background: #1a1c24; padding: 10px; border-radius: 6px; font-size: 13px; border-left: 3px solid #1f80e0; }
        .u-name { font-weight: bold; color: #1f80e0; margin-right: 5px; }
    </style>
</head>

        <iframe src="https://crex.com/cricket-live-score/csk-vs-pbks-7th-match-indian-premier-league-2026-match-updates-10Y5" class="score-frame"></iframe>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        var player = videojs('my-video');

        function switchTab(evt, tabId) {
            var contents = document.getElementsByClassName("tab-content");
            for (var i = 0; i < contents.length; i++) { contents[i].style.display = "none"; }
            var tabs = document.getElementsByClassName("tab-item");
            for (var i = 0; i < tabs.length; i++) { tabs[i].classList.remove("active"); }
            document.getElementById(tabId).style.display = "block";
            evt.currentTarget.classList.add("active");
        }

        // ====== JAVASCRIPT FOR INTRO OVERLAY ======
        const introVideo = document.getElementById('intro-video');
        const introOverlay = document.getElementById('intro-overlay');
        const clickPrompt = document.getElementById('click-prompt');
        let introStarted = false;

        function playIntroVideo() {
            if (introStarted) return;
            introStarted = true;

            clickPrompt.style.display = 'none';
            introVideo.style.display = 'block';

            introVideo.muted = false; // Original video sound play hoga
            introVideo.play().catch(error => {
                console.log("Intro video block bypass: ", error);
                removeIntroOverlay();
            });
        }

        function removeIntroOverlay() {
            introOverlay.classList.add('hide-intro');
        }

        // Video khatam hote hi overlay hatega
        introVideo.onended = function() {
            removeIntroOverlay();
        };

        // Safety net (Bypass)
        setTimeout(() => {
            if (!introOverlay.classList.contains('hide-intro')) {
                removeIntroOverlay();
            }
        }, 10000);
    </script>
