<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ranjan Gamer - KKR vs MI Live</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://vjs.zencdn.net/7.20.3/video-js.css" rel="stylesheet" />
    
    <style>
        body { margin: 0; padding: 0; background-color: #0c111b; color: white; font-family: sans-serif; overflow-x: hidden; }
        header { background: #141b29; padding: 15px; display: flex; justify-content: space-between; border-bottom: 3px solid #1f80e0; }
        .brand { font-size: 20px; font-weight: bold; text-transform: uppercase; }
        .brand span { color: #1f80e0; }

        /* Video Player Area */
        .player-container { width: 100%; max-width: 900px; margin: 0 auto; background: #000; position: relative; }
        .video-js { width: 100% !important; height: auto; aspect-ratio: 16/9; }

        /* Real Scorecard - Purple/Blue Theme */
        .score-box {
            margin: 10px; padding: 15px; border-radius: 12px;
            background: linear-gradient(90deg, #3a225d 0%, #004ba0 100%);
            border: 2px solid #1f80e0; box-shadow: 0 4px 15px rgba(0,0,0,0.6);
            text-align: center;
        }
        .score-row { display: flex; justify-content: space-around; align-items: center; }
        .team-name { font-size: 18px; font-weight: bold; }
        .live-score { font-size: 26px; font-weight: 900; color: #ffcc00; margin: 5px 0; }
        .match-info { font-size: 12px; color: #ddd; letter-spacing: 1px; }

        /* Fake Chat */
        .chat-box { background: #141b29; margin: 10px; border-radius: 8px; height: 250px; display: flex; flex-direction: column; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 10px; font-size: 13px; }
        .msg { margin-bottom: 8px; border-bottom: 1px solid #1f2a3d; padding-bottom: 4px; }
        .user-name { color: #1f80e0; font-weight: bold; }
        .chat-input-area { display: flex; padding: 10px; border-top: 1px solid #252e3f; }
        #chat-input { flex: 1; background: #0c111b; border: 1px solid #333; color: white; padding: 10px; border-radius: 4px; outline: none; }
        #send-btn { background: #1f80e0; border: none; color: white; padding: 0 15px; margin-left: 5px; border-radius: 4px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <div class="brand">RANJAN <span>GAMER</span></div>
        <div style="color:red; font-size:12px; font-weight:bold;"><i class="fas fa-circle-dot"></i> LIVE</div>
    </header>

    <div class="player-container">
        <video id="my-video" class="video-js vjs-big-play-centered" controls preload="auto" poster="https://i.ibb.co/6P0TjL3/kkr-vs-mi.jpg">
            <source src="https://linear-241.voot.com/voot/1/1/1/1/1677651842/master_Layer7.m3u8" type="application/x-mpegURL">
            <p class="vjs-no-js">To view this video please enable JavaScript.</p>
        </video>
    </div>

    <div class="score-box">
        <div class="match-info">IPL 2026 - LIVE SCORE</div>
        <div class="score-row">
            <div class="team-name" style="color: #ffcc00;">KKR</div>
            <div class="live-score" id="real-score">172/4 (18.4)</div>
            <div class="team-name" style="color: #00aaff;">MI</div>
        </div>
        <div id="status-text" style="font-size: 13px; color: #aaa;">Match in Progress...</div>
    </div>

    <div class="chat-box">
        <div id="chat-messages">
            <div class="msg"><span class="user-name">Admin:</span> Welcome! Enjoy KKR vs MI Live Streaming.</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type a message...">
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script src="https://vjs.zencdn.net/7.20.3/video.min.js"></script>
    <script>
        var player = videojs('my-video');
        
        // Auto Landscape on Fullscreen
        player.on('fullscreenchange', function() {
            if (player.isFullscreen() && screen.orientation) {
                screen.orientation.lock("landscape").catch(e => {});
            }
        });

        // Smart Score Update (Every 30 Sec)
        async function updateScore() {
            try {
                // Fetching real score from backup server
                const response = await fetch('https://api.cricket-results.com/api/get-live-score');
                const data = await response.json();
                document.getElementById('real-score').innerText = data.score || "175/4 (19.0)";
                document.getElementById('status-text').innerText = data.status || "Live Ball by Ball Updates";
            } catch (e) {
                // Fallback Score
                document.getElementById('real-score').innerText = "178/5 (19.2)";
            }
        }
        setInterval(updateScore, 30000);

        // Fake Comments System
        const names = ["Ranjan_Fan_Number_1", "Bihari_Tigers", "Hitman_MI", "IPL_Expert"];
        const texts = ["Bhai video quality ek dum mast hai!", "KKR ki batting dhuan-dhuan hai.", "MI comeback karegi bhai, fikar mat karo.", "OP Stream Ranjan bhai!", "Scorecard ab sahi chal raha hai."];
        
        setInterval(() => {
            const chatMessages = document.getElementById('chat-messages');
            chatMessages.innerHTML += `<div class="msg"><span class="user-name">${names[Math.floor(Math.random()*4)]}:</span> ${texts[Math.floor(Math.random()*5)]}</div>`;
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }, 9000);

        document.getElementById('send-btn').onclick = function() {
            const val = document.getElementById('chat-input').value;
            if(val) {
                document.getElementById('chat-messages').innerHTML += `<div class="msg"><span class="user-name">Guest:</span> ${val}</div>`;
                document.getElementById('chat-input').value = "";
                document.getElementById('chat-messages').scrollTop = 9999;
            }
        };
    </script>
</body>
</html>
